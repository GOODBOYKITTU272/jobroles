name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run Vitest tests
      run: npm run test

    - name: Run Next.js build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://mock-url.supabase.co"
        SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key-length-long-enough-to-be-valid-for-supabase-client-check-abcdefghijklmnopqrstuvwxyz"
